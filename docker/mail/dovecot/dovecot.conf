# plMail mailstore — Dovecot as the mailbox server.
# Port 143: plaintext IMAP inside the compose network (plMail's sync).
# Port 993: TLS IMAP for the outside world (Thunderbird, phone mail apps).
# The entrypoint puts the cert at /etc/dovecot/tls/ (mounted or self-signed).

protocols = imap lmtp

# Log to the container's output so `docker compose logs mailstore` shows
# logins and their failures (there is no syslog in this container).
# auth_verbose says WHY a login failed; passwords are never logged.
log_path = /dev/stderr
info_log_path = /dev/stderr
auth_verbose = yes
auth_verbose_passwords = no
listen = *
base_dir = /run/dovecot

disable_plaintext_auth = no
auth_mechanisms = plain login
ssl = yes
ssl_cert = </etc/dovecot/tls/cert.pem
ssl_key = </etc/dovecot/tls/key.pem
# Modern TLS only; old clients can still use 143+STARTTLS internally.
ssl_min_protocol = TLSv1.2

# One Maildir per mailbox, owned by the vmail user (uid/gid 5000).
mail_location = maildir:/var/mail/vhosts/%d/%n
mail_uid = 5000
mail_gid = 5000
first_valid_uid = 5000
last_valid_uid = 5000

# Logins are full addresses (user@example.com); passwords from /etc/dovecot/users.
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/users
}
# SMTP keys for scripts (plMail UI → /etc/plmail-mail-config/smtp_keys).
# Tried after the mailbox users; usernames are smtp_<id>, hex SHA-256 hashes
# (the {SHA256.HEX} prefix is on each line of the file).
# Dovecot reads the file on each auth — no reload needed.
passdb {
  driver = passwd-file
  args = scheme=SHA256.HEX username_format=%u /etc/plmail-mail-config/smtp_keys
}
userdb {
  driver = static
  args = uid=5000 gid=5000 home=/var/mail/vhosts/%d/%n
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
service lmtp {
  inet_listener lmtp {
    port = 24
  }
}
# BearerMail: failed-login blocking. Written by the entrypoint (auth policy
# pointed at the app); empty when MAIL_LOGIN_GUARD=off.
!include_try /etc/dovecot/auth-policy.conf

# Postfix authenticates submission users against this.
service auth {
  inet_listener {
    port = 12345
  }
}
