# The image this fork's GitHub Actions publish (.github/workflows/docker.yml).
# Pulled rather than built here, because only the published image has
# APP_VERSION, APP_COMMIT and APP_IMAGE stamped in, and Admin → Updates needs
# all three to tell whether a newer build exists.
#
# `latest` is the newest release (Actions → Release), what the Releases channel
# in Admin → Updates follows. To run every build of main instead, set
# BEARERMAIL_TAG=main in your shell's environment and choose the Main channel;
# bin/auto-update sets it from the channel by itself.
#
# `docker compose pull && docker compose up -d` upgrades. `build` stays as a
# fallback for a server that cannot reach ghcr.io: `docker compose up -d
# --build` still works, it just has no commit to compare against.
x-app-image: &app-image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_IMAGE: ghcr.io/danverskara/pl_mail_bearermail
      # Stamped by update.sh from the checkout it builds, so Admin → Updates
      # knows which commit is running and can compare it with the channel's.
      APP_COMMIT: ${APP_COMMIT:-}
      APP_VERSION: ${APP_VERSION:-}
  image: ghcr.io/danverskara/pl_mail_bearermail:${BEARERMAIL_TAG:-latest}

x-app-env: &app-env
  APP_ENV: prod
  APP_SECRET: ${APP_SECRET:-}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_USER: ${POSTGRES_USER:-app}
  POSTGRES_DB: ${POSTGRES_DB:-app}
  POSTGRES_VERSION: ${POSTGRES_VERSION:-18}
  MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
  MERCURE_URL: ${MERCURE_URL:-http://mercure/.well-known/mercure}
  MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL:-https://localhost/.well-known/mercure}
  MERCURE_COOKIE_NAME: ${MERCURE_COOKIE_NAME:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
  OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
  OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-false}
  OIDC_REQUIRE_VERIFIED_EMAIL: ${OIDC_REQUIRE_VERIFIED_EMAIL:-true}

x-app-storage: &app-storage
  - app_secrets:/app/var/secrets
  - app_attachments:/app/var/attachments
  - app_raw:/app/var/raw
  - app_uploads:/app/var/uploads

services:
  secrets-init:
    <<: *app-image
    restart: "no"
    entrypoint: ["generate-secrets"]
    environment:
      APP_SECRET: ${APP_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-}
    volumes:
      - app_secrets:/app/var/secrets

  php:
    <<: *app-image
    restart: unless-stopped
    # Mail-server settings and secrets (relay login, mailbox passwords,
    # Cloudflare token). A file of their own, ignored by git and the image
    # build, so no secret lives in the tracked .env. See .env.mail.dist.
    env_file:
      - path: .env.mail.local
        required: false
    environment:
      <<: *app-env
      SERVER_NAME: ${SERVER_NAME:-localhost, :443}, php:80
      MAILER_DSN: ${MAILER_DSN:-null://null}
      APP_CONTAINER_NAME: web
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - app_secrets:/app/var/secrets
      - app_attachments:/app/var/attachments
      - app_raw:/app/var/raw
      - app_uploads:/app/var/uploads
      # Drive files. Their own volume, not app_uploads: app:prune-blobs sweeps
      # app_uploads for files no row references and would delete them.
      - app_drive:/app/var/drive
      # Shared with mta/mailstore: relay.conf and smtp_keys written by the UI.
      - mail_config:/etc/plmail-mail-config
    ports:
      - target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  worker:
    <<: *app-image
    restart: unless-stopped
    command: php bin/console app:work
    # Same mail settings file as php (see the note there).
    env_file:
      - path: .env.mail.local
        required: false
    # The IMAP supervisor's children are this container's grandchildren; if
    # the supervisor dies hard, something has to reap them. Docker's own init.
    init: true
    stop_grace_period: 30s
    environment:
      <<: *app-env
      APP_CONTAINER_NAME: worker
    networks:
      default:
        aliases: [mercure]
    volumes:
      - mercure_data:/data
      - mercure_config:/config
      - app_secrets:/app/var/secrets
      - app_attachments:/app/var/attachments
      - app_raw:/app/var/raw
      - app_uploads:/app/var/uploads
      # Drive files, so app:backup (run here by the scheduler) includes them.
      - app_drive:/app/var/drive
      # The scheduler syncs Settings → Aliases to the mail server from here.
      - mail_config:/etc/plmail-mail-config
    healthcheck:
      disable: true
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    # BearerMail: without this the database stayed down after the host
    # rebooted, and the web server and workers, which wait for it, sat at
    # "starting" forever. Every other long-running service already had it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD_FILE: /run/plmail/postgres_password
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql
      - app_secrets:/run/plmail:ro
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=top"

  ntfy:
    image: binwiederhier/ntfy
    profiles: [push]
    restart: unless-stopped
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://${SERVER_NAME:-localhost}:${NTFY_PORT:-8090}}
      NTFY_LISTEN_HTTP: ':80'
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
      NTFY_VISITOR_REQUEST_LIMIT_BURST: '60'
      NTFY_VISITOR_REQUEST_LIMIT_REPLENISH: '5s'
    ports:
      - "${NTFY_PORT:-8090}:80"
    volumes:
      - ntfy_data:/var/lib/ntfy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/v1/health"]
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Self-hosted mail server ─────────────────────────────────────────────
  # Postfix (SMTP) + Dovecot (IMAP/LMTP) + OpenDKIM, so plMail can receive
  # mail for your own domain and send it without any third party.
  #
  # Optional and off by default: `docker compose --profile mail up -d`.
  # Nobody who does not host their own domain pays for containers they
  # never use.
  #
  # How it fits together:
  #   internet --port 25--> mta (Postfix) --LMTP--> mailstore (Dovecot)
  #   plMail --IMAP 143--> mailstore            (reading, like any account)
  #   plMail --SMTP 587--> mta                 (sending, DKIM-signed)
  #
  # Port 587 is deliberately NOT published: submission stays inside the
  # compose network, where plMail reaches it as `mta:587` with no TLS
  # needed. See docs/install/self-hosted-mail-server.md for DNS, mailboxes,
  # testing, and how to expose submission later.
  mta:
    build: ./docker/mail/postfix
    profiles: [mail]
    hostname: mail
    restart: unless-stopped
    ports:
      - "25:25"
    # MAIL_DOMAIN, MAIL_HELO, MAIL_ACCOUNTS and the relay come from
    # .env.mail.local. Not repeated under `environment`: a key there beats
    # env_file even when blank, and would hide the file's value.
    env_file:
      - path: .env.mail.local
        required: false
    environment:
      MAILSTORE_HOST: mailstore
      DKIM_SELECTOR: ${MAIL_DKIM_SELECTOR:-mail}
      TLS_CERT: /certs/fullchain.pem
      TLS_KEY: /certs/privkey.pem
    volumes:
      - mail_dkim:/etc/opendkim/keys
      - ${MAIL_CERTS_PATH:-./docker/mail/certs}:/certs:ro
      # relay.conf from Admin -> Mail server. Without this mount the UI wrote
      # a file the mta never saw.
      - mail_config:/etc/plmail-mail-config
    depends_on:
      mailstore:
        condition: service_started

  mailstore:
    build: ./docker/mail/dovecot
    profiles: [mail]
    hostname: mailstore
    restart: unless-stopped
    ports:
      - "993:993"
    env_file:
      - path: .env.mail.local
        required: false
    environment:
      TLS_CERT: /certs/fullchain.pem
      TLS_KEY: /certs/privkey.pem
    volumes:
      - mail_data:/var/mail/vhosts
      - ${MAIL_CERTS_PATH:-./docker/mail/certs}:/certs:ro
      - mail_config:/etc/plmail-mail-config

volumes:
  app_secrets:
  app_drive:
  mail_data:
  mail_dkim:
  mail_config:
  app_attachments:
  app_raw:
  app_uploads:
  caddy_data:
  caddy_config:
  database_data:
  mercure_data:
  mercure_config:
  ntfy_data:
