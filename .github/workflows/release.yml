name: Release

# One button: Actions → Release → Run workflow. It releases the commit at the
# tip of the branch it is run on (main), with no version to type:
#
#  1. the next version is worked out from the newest v* tag — patch by default,
#     minor or major when chosen; the first release of this fork is v0.4.0,
#     after upstream's last, v0.3.3;
#  2. the commit is tagged, and a GitHub release is made from it, titled with
#     the version and the commit it was cut from, with the changes since the
#     last release as its notes;
#  3. the Docker workflow is started on the tag, which publishes the image as
#     `latest` (what Admin → Updates → Releases follows), the version, and
#     the major.minor.
#
# Step 3 is a dispatch rather than the tag push itself because a tag pushed
# with GITHUB_TOKEN starts no workflows; a workflow_dispatch is the exception.
on:
    workflow_dispatch:
        inputs:
            bump:
                description: Which part of the version goes up
                type: choice
                options: [patch, minor, major]
                default: patch

# Two releases at once would both read the same newest tag and pick the same
# next version.
concurrency: release

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Work out the next version
              id: version
              shell: bash
              env:
                  BUMP: ${{ inputs.bump }}
              run: |
                  if released=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -1) && [ -n "$released" ]; then
                      echo "::error::This commit is already released as $released."
                      exit 1
                  fi

                  last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)

                  if [ -z "$last" ]; then
                      next=v0.4.0
                  else
                      IFS=. read -r major minor patch <<< "${last#v}"
                      case "$BUMP" in
                          major) next="v$((major + 1)).0.0" ;;
                          minor) next="v${major}.$((minor + 1)).0" ;;
                          *)     next="v${major}.${minor}.$((patch + 1))" ;;
                      esac
                  fi

                  echo "next=$next" >> "$GITHUB_OUTPUT"
                  echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
                  echo "Releasing $(git rev-parse --short HEAD) as $next (last: ${last:-none})."

            - name: Tag the commit
              env:
                  NEXT: ${{ steps.version.outputs.next }}
              run: |
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git tag -a "$NEXT" -m "$NEXT"
                  git push origin "$NEXT"

            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  NEXT: ${{ steps.version.outputs.next }}
                  SHORT: ${{ steps.version.outputs.short }}
              run: gh release create "$NEXT" --verify-tag --generate-notes --title "$NEXT · $SHORT"

            - name: Build and publish the image
              env:
                  GH_TOKEN: ${{ github.token }}
                  NEXT: ${{ steps.version.outputs.next }}
              run: gh workflow run docker.yml --ref "$NEXT"
